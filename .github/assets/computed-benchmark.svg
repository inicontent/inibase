<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Bulk POST: plain vs computed fields</title><desc id="desc">Documented benchmark: 10 rows 21.90 vs 22.69 ms; 100 rows 22.00 vs 25.23 ms; 1000 rows 28.79 vs 35.15 ms. Minimum of three rounds with fsync and journal enabled. Machine and version were not recorded in the source table.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1323"/><stop offset="1" stop-color="#162d3a"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#6ce5b2" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="620" rx="24" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="52" y="57" font-size="17" fill="#6ce5b2" font-weight="700">INIBASE  /  BENCHMARK SNAPSHOT</text><text x="52" y="111" font-size="36" fill="#fff" font-weight="700">The cost of computed fields, made visible.</text><text x="52" y="150" font-size="20" fill="#aebed2" font-weight="400">Bulk POST time in milliseconds • lower is better • fsync + journal enabled</text><rect x="730" y="181" width="18" height="18" rx="4" fill="#6ce5b2" stroke="#6ce5b2"/><text x="758" y="197" font-size="17" fill="#dbe6f4" font-weight="400">Plain</text><rect x="855" y="181" width="18" height="18" rx="4" fill="#8aa8ff" stroke="#8aa8ff"/><text x="883" y="197" font-size="17" fill="#dbe6f4" font-weight="400">Computed</text><path d="M205 223 V499" stroke="#2b3c55"/><text x="197" y="528" font-size="16" fill="#aebed2" font-weight="400">0</text><path d="M405 223 V499" stroke="#2b3c55"/><text x="397" y="528" font-size="16" fill="#aebed2" font-weight="400">10</text><path d="M605 223 V499" stroke="#2b3c55"/><text x="597" y="528" font-size="16" fill="#aebed2" font-weight="400">20</text><path d="M805 223 V499" stroke="#2b3c55"/><text x="797" y="528" font-size="16" fill="#aebed2" font-weight="400">30</text><path d="M1005 223 V499" stroke="#2b3c55"/><text x="997" y="528" font-size="16" fill="#aebed2" font-weight="400">40</text><text x="52" y="271" font-size="20" fill="#fff" font-weight="700">10 rows</text><rect x="205" y="237" width="438.0" height="23" rx="4" fill="#6ce5b2" stroke="#6ce5b2"/><text x="656.0" y="255" font-size="17" fill="#dbe6f4" font-weight="400">21.90</text><rect x="205" y="269" width="453.8" height="23" rx="4" fill="#8aa8ff" stroke="#8aa8ff"/><text x="671.8" y="287" font-size="17" fill="#dbe6f4" font-weight="400">22.69</text><text x="52" y="362" font-size="20" fill="#fff" font-weight="700">100 rows</text><rect x="205" y="328" width="440.0" height="23" rx="4" fill="#6ce5b2" stroke="#6ce5b2"/><text x="658.0" y="346" font-size="17" fill="#dbe6f4" font-weight="400">22.00</text><rect x="205" y="360" width="504.6" height="23" rx="4" fill="#8aa8ff" stroke="#8aa8ff"/><text x="722.6" y="378" font-size="17" fill="#dbe6f4" font-weight="400">25.23</text><text x="52" y="453" font-size="20" fill="#fff" font-weight="700">1,000 rows</text><rect x="205" y="419" width="575.8" height="23" rx="4" fill="#6ce5b2" stroke="#6ce5b2"/><text x="793.8" y="437" font-size="17" fill="#dbe6f4" font-weight="400">28.79</text><rect x="205" y="451" width="703.0" height="23" rx="4" fill="#8aa8ff" stroke="#8aa8ff"/><text x="921.0" y="469" font-size="17" fill="#dbe6f4" font-weight="400">35.15</text><text x="52" y="576" font-size="17" fill="#aebed2" font-weight="400">Source: README → Benchmark → Computed fields. Minimum of 3 rounds; sample results, not guarantees.</text></g></svg>
