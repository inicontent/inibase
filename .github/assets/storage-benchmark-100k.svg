<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="398" viewBox="0 0 1200 398" role="img" aria-labelledby="title desc">
  <title id="title">Final disk footprint</title>
  <desc id="desc">Allocated disk in MiB for 100,000 synthetic CMS records. iniBase 12.14, SQLite 149.48, PostgreSQL 330.14. PostgreSQL includes the full cluster and WAL.</desc>
  <rect width="1200" height="398" rx="24" fill="#0e192b"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e0edf8">
    <text x="52" y="50" font-size="23" fill="#6ce5b2" font-weight="700">iniBase</text>
    <text x="52" y="101" font-size="38" fill="#ffffff" font-weight="700">Final disk footprint</text>
    <text x="52" y="140" font-size="21" fill="#aebed2">100,000 synthetic CMS records · Median allocated MiB across three trials · Lower is better</text>
    <path d="M225 180V312" stroke="#2b3c55"/>
    <text x="225" y="337" font-size="17" fill="#aebed2" text-anchor="middle">0</text>
    <path d="M337.857 180V312" stroke="#2b3c55"/>
    <text x="337.857" y="337" font-size="17" fill="#aebed2" text-anchor="middle">50</text>
    <path d="M450.714 180V312" stroke="#2b3c55"/>
    <text x="450.714" y="337" font-size="17" fill="#aebed2" text-anchor="middle">100</text>
    <path d="M563.571 180V312" stroke="#2b3c55"/>
    <text x="563.571" y="337" font-size="17" fill="#aebed2" text-anchor="middle">150</text>
    <path d="M676.429 180V312" stroke="#2b3c55"/>
    <text x="676.429" y="337" font-size="17" fill="#aebed2" text-anchor="middle">200</text>
    <path d="M789.286 180V312" stroke="#2b3c55"/>
    <text x="789.286" y="337" font-size="17" fill="#aebed2" text-anchor="middle">250</text>
    <path d="M902.143 180V312" stroke="#2b3c55"/>
    <text x="902.143" y="337" font-size="17" fill="#aebed2" text-anchor="middle">300</text>
    <path d="M1015 180V312" stroke="#2b3c55"/>
    <text x="1015" y="337" font-size="17" fill="#aebed2" text-anchor="middle">350</text>
    <text x="52" y="209" font-size="21" fill="#e0edf8">iniBase</text>
    <rect x="225" y="190" width="27.41" height="24" rx="4" fill="#6ce5b2"/>
    <text x="265.41" y="209" font-size="20" fill="#e0edf8">12.14</text>
    <text x="52" y="254" font-size="21" fill="#e0edf8">SQLite</text>
    <rect x="225" y="235" width="337.41" height="24" rx="4" fill="#8aa8ff"/>
    <text x="575.41" y="254" font-size="20" fill="#e0edf8">149.48</text>
    <text x="52" y="299" font-size="21" fill="#e0edf8">PostgreSQL</text>
    <rect x="225" y="280" width="745.18" height="24" rx="4" fill="#c0aeff"/>
    <text x="983.18" y="299" font-size="20" fill="#e0edf8">330.14</text>
    <text x="52" y="374" font-size="17" fill="#aebed2">iniBase uses gzip compression. PostgreSQL includes the full cluster and WAL.</text>
  </g>
</svg>
