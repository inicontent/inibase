<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
<title id="title">Inibase at a glance</title><desc id="desc">Conceptual view of the TypeScript API and column-file storage, with relations, explicit transactions, and journal-backed durability.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a1323"/><stop offset="1" stop-color="#162d3a"/></linearGradient><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6" fill="none" stroke="#6ce5b2" stroke-width="1.5"/></marker></defs>
<rect width="1200" height="620" rx="24" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="52" y="58" font-size="17" fill="#6ce5b2" font-weight="700">INIBASE  /  TYPESCRIPT DATABASE</text><text x="52" y="123" font-size="42" fill="#ffffff" font-weight="700">Your data. In files. Under your control.</text><text x="52" y="166" font-size="23" fill="#aebed2" font-weight="400">Relational data, column files, and explicit transactions.</text><rect x="52" y="212" width="510" height="246" rx="16" fill="#152238" stroke="#2b3c55"/><text x="78" y="251" font-size="15" fill="#6ce5b2" font-weight="700">A SMALL API. A REAL DATA MODEL.</text><text x="78" y="292" font-family="monospace" font-size="18" fill="#e0edf8">const db = new Inibase(&quot;my-app&quot;);</text><text x="78" y="323" font-family="monospace" font-size="18" fill="#e0edf8"></text><text x="78" y="354" font-family="monospace" font-size="18" fill="#e0edf8">await db.get(&quot;products&quot;);</text><text x="78" y="385" font-family="monospace" font-size="18" fill="#e0edf8">await db.begin([&quot;orders&quot;, &quot;invoices&quot;]);</text><text x="78" y="416" font-family="monospace" font-size="18" fill="#e0edf8">// stage writes, then commit or rollback</text><path d="M579 328 H626 V328" fill="none" stroke="#6ce5b2" stroke-width="3" marker-end="url(#arrow)"/><rect x="648" y="212" width="500" height="246" rx="16" fill="#152238" stroke="#2b3c55"/><text x="675" y="252" font-size="15" fill="#6ce5b2" font-weight="700">DATABASE / TABLE / COLUMNS</text><rect x="675" y="275" width="139" height="157" rx="16" fill="#0c1728" stroke="#2b3c55"/><text x="690" y="305" font-size="19" fill="#ffffff" font-weight="700">id</text><text x="690" y="339" font-size="16" fill="#aebed2" font-weight="400">1</text><text x="690" y="368" font-size="16" fill="#aebed2" font-weight="400">2</text><text x="690" y="397" font-size="16" fill="#aebed2" font-weight="400">3</text><rect x="826" y="275" width="139" height="157" rx="16" fill="#0c1728" stroke="#2b3c55"/><text x="841" y="305" font-size="19" fill="#ffffff" font-weight="700">name</text><text x="841" y="339" font-size="16" fill="#aebed2" font-weight="400">Notebook</text><text x="841" y="368" font-size="16" fill="#aebed2" font-weight="400">Pencil</text><text x="841" y="397" font-size="16" fill="#aebed2" font-weight="400">Sketchbook</text><rect x="977" y="275" width="139" height="157" rx="16" fill="#0c1728" stroke="#2b3c55"/><text x="992" y="305" font-size="19" fill="#ffffff" font-weight="700">price</text><text x="992" y="339" font-size="16" fill="#aebed2" font-weight="400">12</text><text x="992" y="368" font-size="16" fill="#aebed2" font-weight="400">2</text><text x="992" y="397" font-size="16" fill="#aebed2" font-weight="400">18</text><rect x="52" y="493" width="354" height="82" rx="16" fill="#152238" stroke="#2b3c55"/><text x="71" y="524" font-size="14" fill="#6ce5b2" font-weight="700">RELATIONS</text><text x="71" y="553" font-size="18" fill="#dbe6f4" font-weight="400">Link tables and select fields</text><rect x="423" y="493" width="354" height="82" rx="16" fill="#152238" stroke="#2b3c55"/><text x="442" y="524" font-size="14" fill="#6ce5b2" font-weight="700">TRANSACTIONS</text><text x="442" y="553" font-size="18" fill="#dbe6f4" font-weight="400">begin / commit / rollback</text><rect x="794" y="493" width="354" height="82" rx="16" fill="#152238" stroke="#2b3c55"/><text x="813" y="524" font-size="14" fill="#6ce5b2" font-weight="700">DURABILITY</text><text x="813" y="553" font-size="18" fill="#dbe6f4" font-weight="400">Write-ahead journal + fsync</text></g></svg>
