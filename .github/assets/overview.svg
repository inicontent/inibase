<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">iniBase at a glance</title>
  <desc id="desc">Conceptual view of the TypeScript API and column-file storage, with relations, explicit transactions, durable commits, and automatic incremental writes.</desc>
  <defs>
    <linearGradient id="bg" x2="100%" y2="100%">
      <stop stop-color="#0a1323" />
      <stop offset="1" stop-color="#162d3a" />
    </linearGradient>
  </defs>
  <rect width="1200" height="620" rx="24" fill="url(#bg)" />
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="52" y="58" font-size="17" fill="#6ce5b2" font-weight="700">iniBase</text>
    <text x="52" y="123" font-size="42" fill="#ffffff" font-weight="700">A file-based TypeScript database</text>
    <text x="52" y="166" font-size="23" fill="#aebed2" font-weight="400">Relational tables, column storage, and durable writes.</text>
    <rect x="52" y="212" width="510" height="246" rx="16" fill="#152238" stroke="#2b3c55" />
    <text x="78" y="251" font-size="15" fill="#6ce5b2" font-weight="700">TYPESCRIPT API</text>
    <text x="78" y="292" font-family="monospace" font-size="18" fill="#e0edf8">const db = new Inibase("my-app");</text>
    <text x="78" y="323" font-family="monospace" font-size="18" fill="#e0edf8" />
    <text x="78" y="354" font-family="monospace" font-size="18" fill="#e0edf8">await db.get("products");</text>
    <text x="78" y="385" font-family="monospace" font-size="18" fill="#e0edf8">await db.begin(["orders", "invoices"]);</text>
    <text x="78" y="416" font-family="monospace" font-size="18" fill="#e0edf8">// stage writes, then commit or rollback</text>
    <path d="M579 328H626m-9-7 9 7-9 7" fill="none" stroke="#6ce5b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="648" y="212" width="500" height="246" rx="16" fill="#152238" stroke="#2b3c55" />
    <text x="675" y="252" font-size="15" fill="#6ce5b2" font-weight="700">DATABASE / TABLE / COLUMNS</text>
    <rect x="675" y="275" width="139" height="157" rx="16" fill="#0c1728" stroke="#2b3c55" />
    <text x="690" y="305" font-size="19" fill="#ffffff" font-weight="700">id</text>
    <text x="690" y="339" font-size="16" fill="#aebed2" font-weight="400">1</text>
    <text x="690" y="368" font-size="16" fill="#aebed2" font-weight="400">2</text>
    <text x="690" y="397" font-size="16" fill="#aebed2" font-weight="400">3</text>
    <rect x="826" y="275" width="139" height="157" rx="16" fill="#0c1728" stroke="#2b3c55" />
    <text x="841" y="305" font-size="19" fill="#ffffff" font-weight="700">name</text>
    <text x="841" y="339" font-size="16" fill="#aebed2" font-weight="400">Notebook</text>
    <text x="841" y="368" font-size="16" fill="#aebed2" font-weight="400">Pencil</text>
    <text x="841" y="397" font-size="16" fill="#aebed2" font-weight="400">Sketchbook</text>
    <rect x="977" y="275" width="139" height="157" rx="16" fill="#0c1728" stroke="#2b3c55" />
    <text x="992" y="305" font-size="19" fill="#ffffff" font-weight="700">price</text>
    <text x="992" y="339" font-size="16" fill="#aebed2" font-weight="400">12</text>
    <text x="992" y="368" font-size="16" fill="#aebed2" font-weight="400">2</text>
    <text x="992" y="397" font-size="16" fill="#aebed2" font-weight="400">18</text>
    <rect x="52" y="493" width="265" height="82" rx="16" fill="#152238" stroke="#2b3c55" />
    <text x="68" y="524" font-size="14" fill="#6ce5b2" font-weight="700">RELATIONS</text>
    <text x="68" y="553" font-size="16" fill="#dbe6f4">Link tables and select fields</text>
    <rect x="329" y="493" width="265" height="82" rx="16" fill="#152238" stroke="#2b3c55" />
    <text x="345" y="524" font-size="14" fill="#6ce5b2" font-weight="700">TRANSACTIONS</text>
    <text x="345" y="553" font-size="16" fill="#dbe6f4">Begin, commit, or roll back</text>
    <rect x="606" y="493" width="265" height="82" rx="16" fill="#152238" stroke="#2b3c55" />
    <text x="622" y="524" font-size="14" fill="#6ce5b2" font-weight="700">DURABILITY</text>
    <text x="622" y="553" font-size="16" fill="#dbe6f4">Write-ahead journal and fsync</text>
    <rect x="883" y="493" width="265" height="82" rx="16" fill="#152238" stroke="#2b3c55" />
    <text x="899" y="524" font-size="14" fill="#6ce5b2" font-weight="700">INCREMENTAL WRITES</text>
    <text x="899" y="553" font-size="16" fill="#dbe6f4">Log eligible updates and deletes</text>
  </g>
</svg>
