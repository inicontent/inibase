<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="398" viewBox="0 0 1200 398" role="img" aria-labelledby="title desc">
  <title id="title">Durable single-record writes</title>
  <desc id="desc">Median update and delete times in milliseconds for 100,000 synthetic CMS records. iniBase took 11.79 and 9.96, SQLite took 3.93 and 3.98, and PostgreSQL took 3.97 and 3.99.</desc>
  <rect width="1200" height="398" rx="24" fill="#0e192b"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#e0edf8">
    <text x="52" y="50" font-size="23" fill="#6ce5b2" font-weight="700">iniBase</text>
    <text x="52" y="101" font-size="38" fill="#ffffff" font-weight="700">Durable single-record writes</text>
    <text x="52" y="140" font-size="21" fill="#aebed2">100,000 synthetic CMS records · Median milliseconds per operation · Lower is better</text>
    <text x="225" y="169" font-size="18" fill="#ffffff" font-weight="700">Update</text>
    <path d="M225 180V312" stroke="#2b3c55"/>
    <text x="225" y="337" font-size="17" fill="#aebed2" text-anchor="middle">0</text>
    <path d="M315 180V312" stroke="#2b3c55"/>
    <text x="315" y="337" font-size="17" fill="#aebed2" text-anchor="middle">3</text>
    <path d="M405 180V312" stroke="#2b3c55"/>
    <text x="405" y="337" font-size="17" fill="#aebed2" text-anchor="middle">6</text>
    <path d="M495 180V312" stroke="#2b3c55"/>
    <text x="495" y="337" font-size="17" fill="#aebed2" text-anchor="middle">9</text>
    <path d="M585 180V312" stroke="#2b3c55"/>
    <text x="585" y="337" font-size="17" fill="#aebed2" text-anchor="middle">12</text>
    <text x="52" y="209" font-size="21" fill="#e0edf8">iniBase</text>
    <rect x="225" y="190" width="353.56" height="24" rx="4" fill="#6ce5b2"/>
    <text x="591.56" y="209" font-size="20" fill="#e0edf8">11.79</text>
    <text x="52" y="254" font-size="21" fill="#e0edf8">SQLite</text>
    <rect x="225" y="235" width="117.92" height="24" rx="4" fill="#8aa8ff"/>
    <text x="355.92" y="254" font-size="20" fill="#e0edf8">3.93</text>
    <text x="52" y="299" font-size="21" fill="#e0edf8">PostgreSQL</text>
    <rect x="225" y="280" width="119.21" height="24" rx="4" fill="#c0aeff"/>
    <text x="357.21" y="299" font-size="20" fill="#e0edf8">3.97</text>
    <text x="721" y="169" font-size="18" fill="#ffffff" font-weight="700">Delete</text>
    <path d="M721 180V312" stroke="#2b3c55"/>
    <text x="721" y="337" font-size="17" fill="#aebed2" text-anchor="middle">0</text>
    <path d="M811 180V312" stroke="#2b3c55"/>
    <text x="811" y="337" font-size="17" fill="#aebed2" text-anchor="middle">3</text>
    <path d="M901 180V312" stroke="#2b3c55"/>
    <text x="901" y="337" font-size="17" fill="#aebed2" text-anchor="middle">6</text>
    <path d="M991 180V312" stroke="#2b3c55"/>
    <text x="991" y="337" font-size="17" fill="#aebed2" text-anchor="middle">9</text>
    <path d="M1081 180V312" stroke="#2b3c55"/>
    <text x="1081" y="337" font-size="17" fill="#aebed2" text-anchor="middle">12</text>
    <rect x="721" y="190" width="298.77" height="24" rx="4" fill="#6ce5b2"/>
    <text x="1032.77" y="209" font-size="20" fill="#e0edf8">9.96</text>
    <rect x="721" y="235" width="119.47" height="24" rx="4" fill="#8aa8ff"/>
    <text x="853.47" y="254" font-size="20" fill="#e0edf8">3.98</text>
    <rect x="721" y="280" width="119.76" height="24" rx="4" fill="#c0aeff"/>
    <text x="853.76" y="299" font-size="20" fill="#e0edf8">3.99</text>
    <text x="52" y="374" font-size="17" fill="#aebed2">Each median pools 24 committed operations across three trials and includes first-use activation.</text>
  </g>
</svg>
